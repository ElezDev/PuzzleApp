name: puzlessapp
description: "A hypnotic puzzle arcade of neon logic, crafted by Edwin Ledezma by ElezDev."
publish_to: 'true'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  audioplayers: ^6.4.0
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
